# All Phase-1 microservices except orchestrator (see orchestrator.yaml).
# Image: gamma-squeeze-platform:local (same multi-service Dockerfile; SERVICE + PORT).
# Apply: kubectl apply -f deploy/k8s/
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-collection
  namespace: gamma-squeeze
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-collection
  template:
    metadata:
      labels:
        app: data-collection
    spec:
      containers:
        - name: data-collection
          image: gamma-squeeze-platform:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: SERVICE
              value: data_collection
            - name: PORT
              value: "8001"
            - name: PYTHONPATH
              value: /app:/app/src
          readinessProbe:
            httpGet:
              path: /ready
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: data-collection
  namespace: gamma-squeeze
spec:
  selector:
    app: data-collection
  ports:
    - port: 8001
      targetPort: 8001
