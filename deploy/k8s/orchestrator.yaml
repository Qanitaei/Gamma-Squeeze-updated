apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: gamma-squeeze
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: gamma-squeeze-platform:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE
              value: orchestrator
            - name: PORT
              value: "8000"
            - name: PYTHONPATH
              value: /app:/app/src
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gamma-secrets
                  key: database_url
                  optional: true
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: gamma-secrets
                  key: redis_url
                  optional: true
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: gamma-config
                  key: kafka_bootstrap
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: gamma-squeeze
spec:
  selector:
    app: orchestrator
  ports:
    - port: 8000
      targetPort: 8000
