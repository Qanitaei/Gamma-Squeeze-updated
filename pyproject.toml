[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamma-squeeze-platform"
version = "0.2.0"
description = "Institutional gamma-squeeze forecasting platform (1–10 trading day horizon)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.3",
  "python-dotenv>=1.0",
  "joblib>=1.3",
  "certifi>=2023.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "httpx>=0.27",
  "hmmlearn>=0.3",
  "polars>=0.20",
  "pyarrow>=15.0",
  "duckdb>=0.10",
  "redis>=5.0",
  "psycopg[binary]>=3.1",
  "sqlalchemy>=2.0",
  "websockets>=12.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
ml = [
  "torch>=2.2",
  "lightning>=2.2",
  "xgboost>=2.0",
  "lightgbm>=4.3",
  "catboost>=1.2",
]
forecast = [
  "darts>=0.29",
  "pytorch-forecasting>=1.0",
]
rl = [
  "stable-baselines3>=2.3",
  "ray[rllib]>=2.9",
  "gymnasium>=0.29",
]
explain = ["shap>=0.45"]
train = ["optuna>=3.6", "mlflow>=2.12"]
viz = ["plotly>=5.18"]
data = []
streaming = ["confluent-kafka>=2.3"]
all = [
  "gamma-squeeze-platform[ml,forecast,rl,explain,train,streaming,viz,dev]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gamma_squeeze = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
  "unit: fast isolated unit tests",
  "integration: multi-module / HTTP integration tests",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
